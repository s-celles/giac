[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
strip = 'emstrip'
exe_wrapper = 'node'

[built-in options]
c_args = ['-Oz', '-fwasm-exceptions']
cpp_args = ['-Oz', '-fwasm-exceptions']
default_library = 'static'

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
