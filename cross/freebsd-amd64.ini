[binaries]
c = 'x86_64-unknown-freebsd13-clang'
cpp = 'x86_64-unknown-freebsd13-clang++'
ar = 'x86_64-unknown-freebsd13-ar'
strip = 'x86_64-unknown-freebsd13-strip'

[properties]
sys_root = '/path/to/freebsd-sysroot'
pkg_config_libdir = '/path/to/freebsd-sysroot/usr/lib/pkgconfig'

[host_machine]
system = 'freebsd'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
