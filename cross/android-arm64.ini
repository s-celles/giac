[binaries]
c = '@NDK@/toolchains/llvm/prebuilt/@NDK_HOST@/bin/aarch64-linux-android21-clang'
cpp = '@NDK@/toolchains/llvm/prebuilt/@NDK_HOST@/bin/aarch64-linux-android21-clang++'
ar = '@NDK@/toolchains/llvm/prebuilt/@NDK_HOST@/bin/llvm-ar'
strip = '@NDK@/toolchains/llvm/prebuilt/@NDK_HOST@/bin/llvm-strip'
ranlib = '@NDK@/toolchains/llvm/prebuilt/@NDK_HOST@/bin/llvm-ranlib'

[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
c_link_args = ['-fuse-ld=lld']
cpp_link_args = ['-fuse-ld=lld']
default_library = 'static'

[properties]
sys_root = '@NDK@/toolchains/llvm/prebuilt/@NDK_HOST@/sysroot'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
