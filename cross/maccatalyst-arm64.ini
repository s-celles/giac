[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'ar'
strip = 'strip'

[built-in options]
c_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios14.0-macabi', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk']
cpp_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios14.0-macabi', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk']
c_link_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios14.0-macabi', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk']
cpp_link_args = ['-arch', 'arm64', '-target', 'arm64-apple-ios14.0-macabi', '-isysroot', '/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk']
default_library = 'static'

[host_machine]
system = 'darwin'
subsystem = 'macos'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
